name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install fastapi uvicorn httpx python-docx pypdf
      - name: Offline tests (no network, no browser, no API key)
        run: python -I jobpilot/tests/run_tests.py
      - name: Bundles build and templates in sync
        run: python tools/build_bundles.py

  dashboard-page:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dashboard/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - run: npm ci
      - name: Type check + build
        run: npm run build
